name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The release version is derived from commit messages, so a malformed message
  # silently costs a release. This gate makes that a CI failure instead.
  commits:
    name: Semantic Commits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # commitlint needs the history to resolve the range it validates.
          fetch-depth: 0

      # Validates only the commits introduced by this push/PR - the existing
      # non-conventional history is never re-checked. Rules: commitlint.config.mjs
      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v6

  coding-standards:
    name: Coding Standards (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, json
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check coding standards
        run: composer run test-cs

      # Native functions, classes and constants must be imported in the file header.
      # The local gate is `make cs-fixer`; this step enforces the same rule on contributors.
      - name: Check global namespace imports
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff --show-progress=none

  static-analysis:
    name: Static Analysis (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, json
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run static analysis
        run: composer run test-static

  tests:
    name: Tests (PHP ${{ matrix.php }}, DBAL ${{ matrix.dbal }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4' ]
        # Both supported DBAL majors are exercised. They differ in the Type base class -
        # DBAL 3 declares getName() abstract, DBAL 4 dropped it - and this package carries
        # one code base for both, so a green run on only one major proves nothing.
        dbal: [ '^3.8', '^4.0' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, json
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ matrix.dbal }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.dbal }}-

      # Narrows the package's own `^3.8 || ^4.0` constraint to the major under test. The
      # lock file is not committed, so `composer update` is the install here, not a bump.
      - name: Pin the DBAL major under test
        run: composer require --no-update "doctrine/dbal:${{ matrix.dbal }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      # `composer show` takes at most one package, so list the direct requirements
      # instead of naming them - the resolved DBAL / Laravel / PHPUnit versions are
      # all in there, and the step is diagnostic only.
      - name: Report the resolved versions
        run: composer show --direct

      - name: Run test suite
        run: ./vendor/bin/phpunit --no-coverage
